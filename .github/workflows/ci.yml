name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile with warnings as errors
        run: |
          mkdir -p build/classes
          javac --release 17 -Xlint:all -Werror -d build/classes *.java tests/*.java

      - name: Run tests
        run: java -cp build/classes DataStructures.AllTests

      - name: Run examples
        run: java -cp build/classes DataStructures.Examples
